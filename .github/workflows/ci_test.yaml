name: test

on:
  push:
  workflow_dispatch:
    inputs:
      run_stage_1:
        description: 'Run Stage 1 (Build)'
        required: true
        type: boolean
        default: true  # Will be checked by default
      run_stage_2:
        description: 'Run Stage 2 (Deploy)'
        required: true
        type: boolean
        default: false # Will be unchecked by default

jobs:
  # --- STAGE 1 ---
  stage_1_build:
    name: Stage 1 Job
    # This job ONLY runs if the 'run_stage_1' checkbox is checked
    if: ${{ inputs.run_stage_1 || github.event_name == 'push'  }}
    runs-on: ubuntu-latest
    steps:
      - name: Execute Build
        run: echo "Executing Stage 1..."

  # --- STAGE 2 ---
  stage_2_deploy:
    name: Stage 2 Job
    # This job ONLY runs if the 'run_stage_2' checkbox is checked
    if: ${{ inputs.run_stage_2 || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deploy
        run: echo "Executing Stage 2..."
